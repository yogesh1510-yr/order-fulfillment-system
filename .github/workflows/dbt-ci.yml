name: dbt CI

on:
  push:
    paths:
      - "dbt_project.yml"
      - "models/**"
      - "macros/**"
      - "seeds/**"
      - "snapshots/**"
      - "dbt_tests/**"
      - ".github/workflows/dbt-ci.yml"
  pull_request:
    paths:
      - "dbt_project.yml"
      - "models/**"
      - "macros/**"
      - "seeds/**"
      - "snapshots/**"
      - "dbt_tests/**"
      - ".github/workflows/dbt-ci.yml"

jobs:
  parse-dbt:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install dbt-core==1.12.5 dbt-postgres==1.11.0

      - name: Create temporary dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          novacart:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                user: ci
                password: ci
                port: 5432
                dbname: ci
                schema: ci
                threads: 2
          EOF

      - name: Parse dbt project
        run: dbt parse

      - name: Compile dbt models
        run: dbt compile --target ci
